plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'jacoco'
    id 'io.freefair.lombok'
}

version = '1.0.0'

dependencies {
    implementation platform(project(':platform'))

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.telegram:telegrambots-spring-boot-starter'

    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    developmentOnly 'org.springframework.boot:spring-boot-devtools:3.5.0'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose:3.5.0'
    runtimeOnly 'org.postgresql:postgresql'

    implementation project(':commons')
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'database']
        }
    }
}