spring:
  application:
    name: project-place-backend
  datasource:
    driver-class-name: org.h2.Driver
    password: sa
    username: sa
    url: jdbc:h2:mem:testdb;MODE=LEGACY
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    database: h2

  liquibase:
    enabled: false

app:
  acl:
    class-identity-query: 'call identity()'
    sid-identity-query: 'call identity()'

  superadmin:
    username: ${ADMIN_USERNAME:superadmin}
    password: ${ADMIN_PASSWORD:superadmin}